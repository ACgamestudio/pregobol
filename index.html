<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PREGOBOL · Bottle-cap football</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --carne:#F2E4CE;
    --linha:#F7F2E8;
    --preto:#0B0806;
  }
  html,body{height:100%;background:#0B0806;overscroll-behavior:none;}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--carne);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:7px;padding:7px 0;touch-action:none;
    background:radial-gradient(900px 600px at 50% 0%,#241a12,#0B0806 72%);
  }

  /* ================= placar ================= */
  .placar{
    width:calc(100% - 14px);display:flex;align-items:stretch;gap:8px;
    background:linear-gradient(180deg,#241A12,#180F0A);
    border:1px solid #3B2A1C;border-radius:11px;padding:7px 10px;
  }
  .time{flex:1;display:flex;align-items:center;gap:9px;padding:3px 7px;border-radius:8px;
        transition:background .2s,box-shadow .2s;}
  .time.ativo{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);}
  .time .cor{width:15px;height:15px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.45);}
  .time .nome{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#B49B7E;line-height:1.2;}
  .time .gols{font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
  .time.b{flex-direction:row-reverse;text-align:right;}
  .vez{display:flex;flex-direction:column;align-items:center;justify-content:center;
       min-width:118px;padding:0 6px;text-align:center;}
  .vez .rot{font-size:8.5px;letter-spacing:.16em;color:#8C755C;text-transform:uppercase;}
  .vez .quem{font-size:13px;font-weight:800;line-height:1.2;margin-top:2px;}
  .vez .quem.pensando{color:#FFD24A;}
  .vez .serie{display:block;font-size:8.5px;font-weight:700;letter-spacing:.06em;
              color:#8C755C;margin-top:2px;text-transform:uppercase;}

  /* ================= tabuleiro ================= */
  .board-wrap{position:relative;width:100%;display:flex;justify-content:center;}
  canvas{display:block;border-radius:9px;box-shadow:0 16px 36px rgba(0,0,0,.65),0 2px 0 #A9906F;}
  .aviso{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
    background:rgba(10,8,5,.94);border:1px solid #5E3A1E;border-radius:12px;
    padding:14px 20px;text-align:center;pointer-events:none;opacity:0;
    transition:opacity .18s,transform .18s;max-width:100%;
  }
  .aviso.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .aviso b{display:block;font-size:24px;margin-bottom:3px;}
  .aviso span{font-size:12.5px;color:#B49B7E;line-height:1.35;}

  /* ============ escudos ao lado da mesa ============
     O recorte sai da própria arte assets/times.webp (ver estiloEscudo no JS),
     então não entra nenhum arquivo novo no jogo. */
  .board-wrap{--ladoW:0px;}
  .lado{
    position:absolute;top:50%;transform:translateY(-50%);width:var(--ladoW);
    display:flex;flex-direction:column;align-items:center;gap:7px;
    pointer-events:none;user-select:none;
  }
  .lado.esq{left:0;}
  .lado.dir{right:0;}
  .escudo{
    width:100%;border-radius:12px;background-repeat:no-repeat;
    border:1px solid #4A3423;box-shadow:0 10px 24px rgba(0,0,0,.55);
    transition:box-shadow .25s,filter .25s,transform .25s;
  }
  .ladoNome{
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8C755C;
    text-align:center;line-height:1.25;transition:color .25s;
  }
  .lado.ativo .escudo{
    transform:translateY(-2px);
    box-shadow:0 0 0 2px rgba(255,210,74,.85),0 0 26px rgba(255,210,74,.30),
               0 10px 24px rgba(0,0,0,.55);
  }
  .lado.ativo .ladoNome{color:var(--carne);}
  .lado.perdeu .escudo{filter:grayscale(.85) brightness(.5);}
  .lado.venceu .escudo{
    box-shadow:0 0 0 2px rgba(255,210,74,.95),0 0 34px rgba(255,210,74,.45);
    animation:pulsaEscudo 1.5s ease-in-out infinite;
  }
  .lado.venceu .ladoNome{color:#FFD24A;}
  @keyframes pulsaEscudo{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
  body.semLados .lado{display:none;}   /* tela estreita: a mesa vem primeiro */

  /* ============ festa do campeão ============ */
  .campeao{
    position:absolute;inset:0;z-index:6;display:none;overflow:hidden;border-radius:9px;
    flex-direction:column;align-items:center;justify-content:center;gap:5px;
    pointer-events:none;
    background:radial-gradient(62% 78% at 50% 44%,rgba(12,9,6,.5),rgba(9,7,5,.93));
  }
  .campeao.on{display:flex;}
  .raios{
    position:absolute;left:50%;top:44%;width:170%;aspect-ratio:1;
    transform:translate(-50%,-50%);
    background:conic-gradient(from 0deg,rgba(255,210,74,.22) 0 5deg,transparent 5deg 18deg);
    -webkit-mask:radial-gradient(closest-side,#000 26%,transparent 76%);
            mask:radial-gradient(closest-side,#000 26%,transparent 76%);
    animation:girarRaios 16s linear infinite;
  }
  @keyframes girarRaios{to{transform:translate(-50%,-50%) rotate(360deg);}}

  .tacaEscudo{
    position:relative;z-index:2;width:min(40%,215px);border-radius:14px;
    background-repeat:no-repeat;
    box-shadow:0 0 0 2px rgba(255,210,74,.9),0 0 48px rgba(255,210,74,.5),
               0 18px 40px rgba(0,0,0,.6);
    animation:entraEscudo .7s cubic-bezier(.2,1.55,.4,1) both,
              flutua 2.8s .7s ease-in-out infinite;
  }
  @keyframes entraEscudo{
    from{opacity:0;transform:scale(.15) rotate(-18deg);}
    to  {opacity:1;transform:scale(1) rotate(0);}}
  @keyframes flutua{
    0%,100%{transform:translateY(0) rotate(-1.4deg);}
    50%    {transform:translateY(-8px) rotate(1.4deg);}}

  .campeao .faixa{
    position:relative;z-index:2;margin-top:8px;
    font-size:clamp(14px,3.2vw,28px);font-weight:800;letter-spacing:.24em;
    text-transform:uppercase;
    background:linear-gradient(180deg,#FFF3CB,#FFC93C 55%,#C1830D);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:sobeTexto .45s .3s both;
  }
  .campeao .nomeCampeao{
    position:relative;z-index:2;font-size:clamp(12px,2.1vw,17px);font-weight:700;
    color:var(--carne);animation:sobeTexto .45s .42s both;
  }
  .campeao .placarFinal{
    position:relative;z-index:2;font-size:11.5px;color:#B49B7E;text-align:center;
    padding:0 12px;animation:sobeTexto .45s .54s both;
  }
  @keyframes sobeTexto{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  .confetes{position:absolute;inset:0;z-index:3;overflow:hidden;}
  .confete{
    position:absolute;top:-24px;border-radius:2px;opacity:0;
    animation-name:cai;animation-timing-function:linear;animation-iteration-count:infinite;
  }
  @keyframes cai{
    0%  {opacity:0;transform:translateY(0) rotate(0);}
    7%  {opacity:1;}
    88% {opacity:1;}
    100%{opacity:0;transform:translateY(var(--dist)) rotate(var(--giro));}}

  @media (prefers-reduced-motion:reduce){
    .raios,.confete,.tacaEscudo,.lado.venceu .escudo{animation:none;}
    .tacaEscudo{opacity:1;}
  }

  /* ================= barra ================= */
  .barra{width:calc(100% - 14px);display:flex;align-items:center;gap:7px;}
  button{
    font:inherit;font-size:12px;font-weight:600;color:var(--carne);cursor:pointer;
    background:#2B1E14;border:1px solid #4A3423;border-radius:8px;padding:8px 12px;
  }
  button:active{transform:translateY(1px);}
  button.on{background:#4A3423;border-color:#7A583A;}
  .dica{flex:1;font-size:11px;color:#9C8468;line-height:1.3;text-align:right;}

  /* em landscape de celular a altura é o gargalo: enxuga o cabeçalho e a barra */
  @media (max-height:480px){
    body{gap:4px;padding:4px;}
    .placar{padding:4px 8px;border-radius:9px;}
    .time .gols{font-size:19px;}
    .time .nome{font-size:9px;}
    .vez{min-width:96px;}
    .vez .quem{font-size:11.5px;}
    button{padding:6px 10px;font-size:11px;}
    .dica{display:none;}
  }

  /* ================= telas cheias ================= */
  .tela{
    position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;padding:16px;
    background:radial-gradient(760px 520px at 50% 24%,#2A1D13,#080605 74%);
    overflow:auto;
  }
  .tela.oculta{display:none;}
  .tela h2{font-size:23px;font-weight:800;}
  .tela .sub{font-size:13px;color:#C6AE8E;text-align:center;}
  .tela .sub b{color:var(--carne);}
  .voltar{background:none;border:none;color:#9C8468;font-size:11.5px;text-decoration:underline;padding:4px;}

  /* --- abertura: só o botão --- */
  .abertura{background:radial-gradient(680px 460px at 50% 50%,#1C1409,#070504 76%);z-index:60;}
  .btnIniciar{
    font-size:25px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#10161F;
    padding:16px 54px;border:none;border-radius:14px;
    background:linear-gradient(180deg,#8CF06A,#3FBE2A);
    box-shadow:0 6px 0 #227A14,0 14px 34px rgba(96,220,90,.42);
    animation:pulsa 1.7s ease-in-out infinite;
  }
  .btnIniciar:active{transform:translateY(4px);box-shadow:0 2px 0 #227A14;}
  @keyframes pulsa{0%,100%{transform:scale(1);}50%{transform:scale(1.045);}}
  .abertura .nota{font-size:12px;color:#B6A288;}
  .abertura .carregando{font-size:12.5px;color:#9CE08A;display:none;}
  .abertura.aguardando .btnIniciar{opacity:.45;pointer-events:none;animation:none;}
  .abertura.aguardando .carregando{display:block;}

  /* --- vinhetas --- */
  .cine{position:fixed;inset:0;z-index:70;background:#000;display:none;}
  .cine.on{display:block;}
  .cine video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;}
  .cine video.esconde{opacity:0;pointer-events:none;}
  .btnPular{position:absolute;right:14px;bottom:14px;z-index:3;font-size:11.5px;font-weight:700;
            letter-spacing:.12em;text-transform:uppercase;background:rgba(12,16,22,.6);
            border:1px solid rgba(255,255,255,.28);border-radius:9px;padding:9px 15px;}

  /* --- menu principal: a arte do splash inteira, com as opções pichadas
         na parede como grafite, no mesmo espírito de "RESPEITO/FOCO/DIVERSÃO" --- */
  .menu{z-index:50;justify-content:center;align-items:flex-end;gap:0;padding:0;background:#07050A;
        overflow:hidden;}
  .menu .fundo,.menu .arte{position:absolute;inset:0;}
  .menu .fundo{background:center/cover no-repeat;filter:blur(30px) brightness(.4);transform:scale(1.1);}
  .menu .arte{background:center/cover no-repeat;}          /* splash nítido, tela cheia */
  /* escurece só a base, para o letreiro de opções respirar sobre a mesa */
  .menu::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,rgba(10,7,4,.10) 0 40%,rgba(10,7,4,.30) 62%,rgba(6,4,2,.82) 100%);}

  /* o título fica escondido — a própria arte já traz "PREGOBOL" no balde;
     mantemos o elemento no DOM mas fora de vista */
  .menu .titulo{display:none;}

  /* painel de opções: grafite pichado, alinhado à base como um letreiro de muro */
  .cards{position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;
         gap:clamp(2px,1.4vh,10px);padding:0 6vw clamp(14px,4vh,34px);width:100%;pointer-events:none;}

  /* cada opção é um "risco de tinta" na parede: sem caixa, só texto e um traço */
  .card{
    pointer-events:auto;position:relative;display:inline-flex;align-items:baseline;gap:10px;
    background:none;border:none;padding:2px 4px;cursor:pointer;text-align:left;
    color:#F4E9D2;font-weight:800;letter-spacing:.02em;text-transform:uppercase;
    font-size:clamp(19px,4.6vw,34px);line-height:1.05;
    text-shadow:0 1px 0 rgba(0,0,0,.55),0 2px 10px rgba(0,0,0,.6),0 0 2px rgba(0,0,0,.7);
    transform:rotate(-1.4deg);transition:transform .12s,color .12s,text-shadow .12s;
  }
  .card .ico{font-size:.82em;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));
             transform:translateY(2px);}
  /* o "em" vira uma legenda a giz ao lado, menor e mais apagada */
  .card em{font-style:normal;font-weight:700;font-size:.34em;letter-spacing:.14em;
           color:#E7C98C;opacity:.82;text-shadow:0 1px 3px rgba(0,0,0,.7);
           transform:rotate(1.4deg) translateY(-.2em);}
  /* leve variação de inclinação para dar cara de pichação feita à mão */
  .card:nth-child(odd){transform:rotate(-2.2deg);}
  .card:nth-child(even){transform:rotate(-.6deg);}
  .card:hover{color:#FFF6E2;}
  .card:active{transform:rotate(-1deg) translateY(2px) scale(.98);color:#FFD24A;}
  /* risco de spray sob o texto ao tocar/passar */
  .card::after{content:"";position:absolute;left:2px;right:6px;bottom:-2px;height:3px;
    background:linear-gradient(90deg,rgba(255,210,74,.9),rgba(255,210,74,0));
    border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .16s;}
  .card:hover::after,.card:active::after{transform:scaleX(1);}

    /* "online" já está no ar: sem risco, sem cinza, sem cursor barrado */
  .card.online{transform:rotate(-1.4deg);}
  .card.online:active{transform:rotate(-1.4deg) scale(.97);}
  .selo{
    margin-left:6px;transform:rotate(6deg);display:inline-block;
    font-size:.3em;font-weight:800;letter-spacing:.1em;color:#E8DAC0;
    border:1.5px dashed rgba(232,218,192,.75);border-radius:5px;padding:2px 6px;
    background:rgba(0,0,0,.35);text-shadow:none;
  }

  /* em telas bem baixas (celular deitado) aperta o letreiro para caber tudo */
  @media (max-height:430px){
    .cards{gap:1px;padding-bottom:8px;}
    .card{font-size:clamp(15px,4vw,22px);}
  }

  /* --- grades de escolha --- */
  .grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:720px;}
  @media (max-width:640px){ .grade{grid-template-columns:repeat(3,1fr);} }
  .op{
    display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 7px;
    background:#241A12;border:1px solid #402D1D;border-radius:10px;font-size:11.5px;
    font-weight:700;line-height:1.15;text-align:center;color:var(--carne);
  }
  .op[disabled]{opacity:.3;}
  .op .camisa{width:30px;height:30px;border-radius:7px;
              box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.5);}
  .op .mini{width:100%;height:34px;border-radius:6px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.5);}
  .confronto{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#C6AE8E;min-height:20px;}
  .confronto .camisa{width:16px;height:16px;border-radius:5px;}

  /* --- escolha de times: a arte inteira, com os escudos como botões --- */
  .telaTimes{padding:0;gap:0;background:#05070B;overflow:hidden;
             align-items:center;justify-content:center;}
  .telaTimes .borrao{position:absolute;inset:0;background:url('assets/times.webp') center/cover no-repeat;
    filter:blur(34px) brightness(.45);transform:scale(1.12);}
  .arteTimes{position:relative;z-index:2;aspect-ratio:1586/992;
    width:min(100%,calc(100vh * 1586 / 992));
    width:min(100%,calc(100dvh * 1586 / 992));
    box-shadow:0 18px 50px rgba(0,0,0,.6);}
  .arteTimes>img{display:block;width:100%;height:100%;border-radius:2px;}

  /* botão invisível por cima de cada escudo */
  .hot{
    position:absolute;padding:0;background:none;cursor:pointer;
    border:2px solid transparent;border-radius:clamp(6px,1.1vw,16px);
    transition:border-color .14s,box-shadow .14s,transform .12s;
  }
  .hot:hover{border-color:rgba(255,255,255,.75);
             box-shadow:0 0 26px rgba(255,255,255,.28),inset 0 0 34px rgba(255,255,255,.12);}
  .hot:active{transform:scale(.985);}
  .hot:focus-visible{outline:3px solid #FFD24A;outline-offset:3px;}
  /* time que o Jogador 1 já levou */
  .hot.usado{cursor:not-allowed;pointer-events:none;
    background:rgba(4,6,10,.74);border-color:rgba(255,255,255,.14);
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:7%;color:#D6DEE9;font-weight:800;
    font-size:clamp(8px,1.05vw,15px);letter-spacing:.03em;text-shadow:0 2px 6px #000;}

  /* na vez do Jogador 2 a legenda da arte é coberta pela legenda certa */
  .subArte{position:absolute;z-index:3;left:26%;right:26%;top:19.6%;height:6%;display:none;
    align-items:center;justify-content:center;color:#EDF2F8;
    font-size:clamp(9px,1.4vw,21px);line-height:1;text-align:center;
    background:radial-gradient(58% 150% at 50% 50%,#080B11 44%,rgba(8,11,17,0) 100%);}
  .subArte b{font-weight:800;}
  .telaTimes.jogador2 .subArte{display:flex;}

  .confrontoArte{position:absolute;z-index:3;left:0;right:0;bottom:2.2%;
    display:flex;align-items:center;justify-content:center;gap:8px;
    color:#C9D3E0;font-size:clamp(8px,1.1vw,15px);text-shadow:0 2px 6px #000;min-height:1em;}
  .confrontoArte .camisa{width:1.15em;height:1.15em;border-radius:.3em;
    box-shadow:0 0 0 1px rgba(0,0,0,.6);}

  .hotspots{position:absolute;inset:0;z-index:4;pointer-events:none;}
  .hotspots .hot{pointer-events:auto;}
  .voltarArte{z-index:4;left:39%;top:82.2%;width:22%;height:4.6%;border-radius:9px;}

  @media (prefers-reduced-motion:reduce){ .hot{transition:none;} }

  /* --- gire o celular --- */
  .girar{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;
         align-items:center;justify-content:center;gap:14px;background:#080605;text-align:center;padding:24px;}
  .girar .ico{font-size:56px;animation:gira 2s ease-in-out infinite;}
  @keyframes gira{0%,45%{transform:rotate(0);}55%,100%{transform:rotate(90deg);}}
  body.jogando .girar.ativa{display:flex;}
</style>
<link rel="stylesheet" href="css/ui-ex.css">
</head>
<body>

<!-- backdrop behind the table: one class per field (see css/ui-ex.css) -->
<div class="cenario" id="cenario"></div>

<div class="placar">
  <div class="time a ativo" id="timeA">
    <div class="cor" id="corA"></div>
    <div><div class="nome" id="nomeA">Player 1</div><div class="gols" id="golsA">0</div></div>
  </div>
  <div class="vez">
    <div class="rot" id="rotLabel">Turn</div>
    <div class="quem" id="quemJoga">—</div>
    <div class="rotuloModo" id="rotuloModo"></div>
  </div>
  <div class="time b" id="timeB">
    <div class="cor" id="corB"></div>
    <div><div class="nome" id="nomeB">Player 2</div><div class="gols" id="golsB">0</div></div>
  </div>
</div>

<div class="board-wrap">
  <div class="lado esq" id="ladoA">
    <div class="escudo" id="escudoA"></div>
    <div class="ladoNome" id="ladoNomeA"></div>
  </div>

  <canvas id="cv"></canvas>

  <div class="lado dir" id="ladoB">
    <div class="escudo" id="escudoB"></div>
    <div class="ladoNome" id="ladoNomeB"></div>
  </div>

  <div class="aviso" id="aviso"><b></b><span></span></div>

  <div class="campeao" id="campeao">
    <div class="raios"></div>
    <div class="confetes" id="confetes"></div>
    <div class="tacaEscudo" id="tacaEscudo"></div>
    <div class="faixa" id="faixaCampeao">CHAMPION!</div>
    <div class="nomeCampeao" id="nomeCampeao"></div>
    <div class="placarFinal" id="placarFinal"></div>
  </div>
</div>

<div class="barra">
  <button id="btnMenu">☰ Menu</button>
  <button id="btnSom" class="on">🔊 Sound</button>
  <button id="btnNovo">↺ New match</button>
  <button id="btnFaixa" title="Next track">🎵</button>
  <button id="btnTela" title="Fullscreen">⛶</button>

  <!-- special shots: earned, spent, never free (spec §6) -->
  <div class="cargasCaixa"><b id="cargas">0</b><span>⚡</span></div>
  <div class="especiais" id="especiais">
    <button data-esp="power" aria-label="Power shot">💥</button>
    <button data-esp="precision" aria-label="Precision shot">🎯</button>
    <button data-esp="curve" aria-label="Curve shot">🌀</button>
    <button data-esp="bounce" aria-label="Bounce shot">🪃</button>
  </div>
